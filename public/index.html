<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quicknote Capture</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1e1e1e;
      --surface: #262626;
      --border: #3d3d3d;
      --text: #dcddde;
      --muted: #999;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap {
      max-width: 32rem;
      margin: 0 auto;
      padding: 1.25rem 1rem 2rem;
    }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.25rem; }
    .sub {
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
    }
    .mode-badge {
      display: inline-block;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #333;
      color: var(--muted);
      margin-left: 6px;
      vertical-align: middle;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }
    input[type="text"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.75rem;
      font: inherit;
    }
    textarea { min-height: 8rem; resize: vertical; }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: 0;
      border-color: transparent;
    }
    .field { margin-bottom: 1rem; }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
    }
    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1rem;
      font-weight: 500;
    }
    .primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
      min-width: 8rem;
    }
    .primary:hover:not(:disabled) { background: var(--accent-hover); }
    .secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .secondary:hover:not(:disabled) { border-color: var(--muted); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    details {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
    }
    summary {
      cursor: pointer;
      color: var(--muted);
      user-select: none;
    }
    details[open] summary { margin-bottom: 0.75rem; }
    .status {
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }
    .status.show { display: block; }
    .status.ok { background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.35); }
    .status.err { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); }
    .status.info { background: rgba(124, 58, 237, 0.12); border: 1px solid rgba(124, 58, 237, 0.35); }
    .hint {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1.25rem;
      line-height: 1.45;
    }
    code { font-size: 0.85em; background: #333; padding: 0.1em 0.35em; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Quicknote Capture <span id="modeBadge" class="mode-badge">REST proxy</span></h1>
    <p class="sub">
      Sla notities op via <strong>Obsidian Local REST API</strong> of Ignis (<code>/ignis-api/</code>).
    </p>

    <details open>
      <summary>Instellingen</summary>
      <div class="field">
        <label for="connectionMode">Backend</label>
        <select id="connectionMode">
          <option value="rest-proxy">Local REST via proxy (/obsidian-rest)</option>
          <option value="proxy">Ignis via proxy (/ignis-api)</option>
        </select>
      </div>
      <div id="restBlock" class="field">
        <label for="restApiKey">Local REST API key</label>
        <input type="password" id="restApiKey" autocomplete="off" placeholder="Obsidian → Local REST API" />
      </div>
      <div id="ignisBlock" class="field" hidden>
        <label for="vaultId">Vault (Ignis)</label>
        <input type="text" id="vaultId" value="My Vault" autocomplete="off" />
      </div>
      <div class="field">
        <label for="folder">Map in vault</label>
        <input type="text" id="folder" value="Inbox" autocomplete="off" />
      </div>
    </details>

    <div class="field">
      <label for="title">Titel</label>
      <input type="text" id="title" placeholder="Onderwerp van de notitie" />
    </div>
    <div class="field">
      <label for="body">Inhoud</label>
      <textarea id="body" placeholder="Wat wil je onthouden?"></textarea>
    </div>

    <div class="row">
      <button type="button" class="primary" id="btnSave">Opslaan</button>
      <button type="button" class="secondary" id="btnTest">Testnotitie</button>
      <button type="button" class="secondary" id="btnPing">Verbinding</button>
    </div>

    <div id="status" class="status" role="status"></div>

    <p class="hint">
      REST-proxy: zet <code>OBSIDIAN_REST_UPSTREAM</code> op je Obsidian-host (standaard
      <code>https://host.docker.internal:27124</code>). Obsidian moet open staan.<br />
      Ignis-proxy: <code>IGNIS_UPSTREAM</code> in docker compose / <code>.env</code>.
    </p>
  </div>

  <script type="module" src="/js/web-app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ignis Quick Capture</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="topline">
      <div>
        <h1>Quick Capture <span id="modeBadge" class="mode-badge">direct</span></h1>
        <p class="sub">Schrijft via Ignis API (host permissions).</p>
      </div>
      <a href="#" id="openOptions">Instellingen</a>
    </div>

    <div class="field">
      <label for="title">Titel</label>
      <input type="text" id="title" placeholder="Onderwerp" autofocus />
    </div>
    <div class="field">
      <label for="body">Inhoud</label>
      <textarea id="body" placeholder="Notitie…"></textarea>
    </div>

    <div class="row">
      <button type="button" class="primary" id="btnSave">Opslaan</button>
      <button type="button" class="secondary" id="btnTest">Test</button>
      <button type="button" class="secondary" id="btnPing">Verbinding</button>
    </div>

    <div id="status" class="status" role="status"></div>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>

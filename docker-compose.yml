services:
  quick-capture:
    image: ${CAPTURE_IMAGE:-ghcr.io/s4ndyp/quicknote:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${CAPTURE_PORT:-8080}:80"
    environment:
      IGNIS_UPSTREAM: ${IGNIS_UPSTREAM:-https://10.5.0.134}
      NGINX_ENVS: IGNIS_UPSTREAM
    # Optioneel: extra host mapping als Ignis op de Docker-host draait (Linux)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

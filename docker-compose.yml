services:
  quick-capture:
    image: ${CAPTURE_IMAGE:-ghcr.io/s4ndyp/quicknote:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${CAPTURE_PORT:-8080}:80"
    environment:
      IGNIS_UPSTREAM: ${IGNIS_UPSTREAM:-https://10.5.0.134}
      OBSIDIAN_REST_UPSTREAM: ${OBSIDIAN_REST_UPSTREAM:-https://host.docker.internal:27124}
      NGINX_ENVS: IGNIS_UPSTREAM,OBSIDIAN_REST_UPSTREAM
    extra_hosts:
      - "host.docker.internal:host-gateway"

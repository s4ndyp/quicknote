services:
  quick-capture:
    build: .
    image: quicknote-capture:latest
    restart: unless-stopped
    ports:
      - "${CAPTURE_PORT:-8080}:80"
    environment:
      # Basis-URL van Ignis (http of https; self-signed cert is OK)
      IGNIS_UPSTREAM: ${IGNIS_UPSTREAM:-https://10.5.0.134}
    # Optioneel: extra host mapping als Ignis op de Docker-host draait (Linux)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
